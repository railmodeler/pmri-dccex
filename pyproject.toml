[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "pmri-dccex"
version = "0.1.0"
description = "DCC-EX driver for the JMRI Python rewrite (Stage 6)."
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
dependencies = [
    "pmri-core==0.1.0",
    "pyserial-asyncio>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<1.0", "pytest-cov>=5.0,<7.0", "mypy>=1.10,<2.0", "ruff>=0.5,<1.0"]

[project.entry-points."pmri.connection"]
dccex = "pmri_dccex:DccexConnection"

[tool.hatch.build.targets.wheel]
packages = ["src/pmri_dccex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "hardware: requires physical DCC hardware; skipped by default (pass --run-hardware to include)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["serial_asyncio.*", "serial.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PL", "PERF"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912"]

[tool.coverage.run]
source = ["pmri_dccex"]
branch = true
omit = ["*/transport/serial_port.py", "*/transport/tcp_port.py"]

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
